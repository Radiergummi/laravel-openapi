name: Tests

# Skip-when-unchanged, without path filters.
#
# Each job probes a "result marker" cache keyed on a content hash of the inputs that affect its
# outcome (source, tests, config, examples, the lockfile). On an exact hit, that input set has
# already passed in a prior green run, so the heavy steps (install + suite) are skipped — but the
# job still runs and reports success, so these stay safe to mark as required checks (unlike
# `paths-ignore`, which would never report on a docs-only PR). The marker is saved only on success,
# so a red run is never remembered as green. A docs-only change leaves the source hash unchanged →
# hit → the suite is skipped; touching any hashed input busts the marker → the suite runs.
#
# The Composer download cache is restored on every (non-skipped) run to speed installs.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        laravel: [ '12.*', '13.*' ]
        include:
          # Pin testbench per matrix cell: Testbench 11 requires Laravel 13, so a plain `composer update` would silently
          # float the L12 cell up to L13.
          - laravel: '12.*'
            laravel-major: '12'
            testbench: '^10.0'
          - laravel: '13.*'
            laravel-major: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Probe result marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-marker
          key: tests-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel-major }}-${{ hashFiles('src/**', 'tests/**', 'config/**', 'examples/**', 'composer.json', 'composer.lock', 'phpstan.neon', 'pint.json', 'phpunit.xml', '.github/workflows/**') }}
          lookup-only: true
      - name: Setup PHP
        if: steps.marker.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Resolve Composer cache directory
        if: steps.marker.outputs.cache-hit != 'true'
        id: composer-cache
        shell: bash
        # language=bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel-major }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel-major }}-
            composer-${{ runner.os }}-
      - name: Constrain Laravel and Testbench versions
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer require \
              --no-update \
              --no-interaction \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
      - name: Install dependencies
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer update \
            --no-interaction \
            --prefer-dist \
            --no-progress
      - name: Verify resolved Laravel major
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          resolved=$(composer show laravel/framework | awk '/^versions / { print $4 }' | sed 's/^v//' | cut -d. -f1)

          if [ "${resolved}" != "${{ matrix.laravel-major }}" ]; then
            echo "::error::Expected Laravel ${{ matrix.laravel-major }}.x but composer resolved ${resolved}.x"
            exit 1
          fi
      # The byte-exact example snapshots are toolchain-specific: symfony/yaml 7.x (Laravel 12) dumps empty maps as
      # `{  }` while 8.x (Laravel 13) dumps `{}`, so a single committed snapshot cannot match across the matrix.
      # They are validated once against the locked toolchain in the `snapshot` job below and excluded here; the
      # semantic ExamplesTest cases (valid 3.1 document, lint-clean) still run on every cell.
      - name: Run tests (excluding toolchain-specific serialization snapshots)
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          vendor/bin/pest \
            --testsuite=Unit,Feature,Arch,PhpStan \
            --log-junit .cache/junit.xml \
            --exclude-group=snapshot \
            --no-coverage
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.marker.outputs.cache-hit != 'true' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          files: .cache/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Record result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        shell: bash
        # language=bash
        run: echo "${GITHUB_SHA}" > .ci-marker
      - name: Persist result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .ci-marker
          key: ${{ steps.marker.outputs.cache-primary-key }}

  test-swagger-low:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PHP 8.4 · Laravel 12 · swagger-php 5.8
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Probe result marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-marker
          key: swaglow-${{ runner.os }}-${{ hashFiles('src/**', 'tests/**', 'config/**', 'examples/**', 'composer.json', 'composer.lock', 'phpstan.neon', 'pint.json', 'phpunit.xml', '.github/workflows/**') }}
          lookup-only: true
      - name: Setup PHP
        if: steps.marker.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - name: Resolve Composer cache directory
        if: steps.marker.outputs.cache-hit != 'true'
        id: composer-cache
        shell: bash
        # language=bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-swaglow-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-swaglow-
            composer-${{ runner.os }}-
      - name: Pin lowest swagger-php and Laravel 12 / Testbench 10
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer require \
              --no-update \
              --no-interaction \
            "zircote/swagger-php:^5.8" \
            "laravel/framework:12.*" \
            "orchestra/testbench:^10.0"
      - name: Install dependencies
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer update \
            --no-interaction \
            --prefer-dist \
            --no-progress
      - name: Verify resolved swagger-php major
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          resolved=$(composer show zircote/swagger-php | awk '/^versions / { print $4 }' | sed 's/^v//' | cut -d. -f1)
          if [ "$resolved" != "5" ]; then
            echo "::error::Expected swagger-php 5.x but composer resolved ${resolved}.x"
            exit 1
          fi
      # The byte-exact example snapshots are pinned to swagger-php 6.x key ordering; swagger-php 5.x emits semantically
      # identical YAML with a different key order, so the snapshot group is excluded here. Everything else (generation,
      # OpenAPI 3.1 validity, lint-clean, all unit/feature tests) runs against 5.8.
      - name: Run tests (excluding 6.x-pinned serialization snapshots)
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          vendor/bin/pest \
            --testsuite=Unit,Feature,Arch,PhpStan \
            --exclude-group=snapshot \
            --no-coverage
      - name: Record result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        shell: bash
        # language=bash
        run: echo "${GITHUB_SHA}" > .ci-marker
      - name: Persist result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .ci-marker
          key: ${{ steps.marker.outputs.cache-primary-key }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # Coverage is a pure function of the same hashed inputs as the test matrix, so it reuses the
      # php8.4/L12 cell's marker rather than its own. That marker is written sooner (the test cells
      # finish well before this slower instrumented run), so a PR opened right after a `main` merge
      # no longer loses the race against coverage's own — formerly last-written — marker and re-runs
      # the full suite for no reason. On a real code change the hash is new and unmarked → coverage
      # runs and uploads as before. Coverage owns no marker of its own (the test job writes this one).
      - name: Probe test result marker (identical inputs ⇒ identical coverage)
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-marker
          key: tests-${{ runner.os }}-php8.4-l12-${{ hashFiles('src/**', 'tests/**', 'config/**', 'examples/**', 'composer.json', 'composer.lock', 'phpstan.neon', 'pint.json', 'phpunit.xml', '.github/workflows/**') }}
          lookup-only: true
      - name: Setup PHP
        if: steps.marker.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: pcov
      - name: Resolve Composer cache directory
        if: steps.marker.outputs.cache-hit != 'true'
        id: composer-cache
        shell: bash
        # language=bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-coverage-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-coverage-
            composer-${{ runner.os }}-
      - name: Install dependencies
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer update \
            --no-interaction \
            --prefer-dist \
            --no-progress
      # Run serially (not the parallel `pest` script): parallel workers race on the shared fixture destination
      # under coverage. Snapshots are excluded here too — they are the `snapshot` job's responsibility.
      - name: Run tests with coverage
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          vendor/bin/pest \
            --testsuite=Unit,Feature,Arch,PhpStan \
            --exclude-group=snapshot \
            --log-junit .cache/junit.xml \
            --coverage \
            --coverage-clover .cache/clover.xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.marker.outputs.cache-hit != 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: .cache/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage reporting must never gate the build; a flaky upload should not fail CI.
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.marker.outputs.cache-hit != 'true' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          files: .cache/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      # No marker save here: coverage reuses the test cell's marker (probed above) and never writes
      # its own, so the test job remains the single writer of that key.

  snapshot:
    name: Snapshot (locked toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Probe result marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-marker
          key: snapshot-${{ runner.os }}-${{ hashFiles('src/**', 'tests/**', 'config/**', 'examples/**', 'composer.json', 'composer.lock', 'phpstan.neon', 'pint.json', 'phpunit.xml', '.github/workflows/**') }}
          lookup-only: true
      - name: Setup PHP
        if: steps.marker.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - name: Resolve Composer cache directory
        if: steps.marker.outputs.cache-hit != 'true'
        id: composer-cache
        shell: bash
        # language=bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-snapshot-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-snapshot-
            composer-${{ runner.os }}-
      # `composer install` (not update) so the byte-exact snapshots are checked against exactly the toolchain
      # they were generated with — the same versions a developer gets locally. This is the one job allowed to
      # run the `snapshot` group.
      - name: Install locked dependencies
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress
      - name: Verify byte-exact snapshots
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          vendor/bin/pest \
            --group=snapshot \
            --no-coverage
      - name: Record result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        shell: bash
        # language=bash
        run: echo "${GITHUB_SHA}" > .ci-marker
      - name: Persist result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .ci-marker
          key: ${{ steps.marker.outputs.cache-primary-key }}

  # Tests for the repo's own survey tooling (tools/survey, .claude/skills/survey), kept out of
  # the library matrix so a tooling regression never reds the library gate. Framework-free pure
  # PHP, so a single PHP 8.4 run is enough; the marker keys only on tooling inputs, so it skips
  # on library-only changes.
  tooling:
    name: Tooling (survey)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Probe result marker
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-marker
          key: tooling-${{ runner.os }}-${{ hashFiles('tools/survey/**', '.claude/skills/survey/**', 'tests/Tools/**', 'tests/Fixtures/survey/**', 'composer.json', 'composer.lock', 'phpunit.xml', '.github/workflows/**') }}
          lookup-only: true
      - name: Setup PHP
        if: steps.marker.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - name: Resolve Composer cache directory
        if: steps.marker.outputs.cache-hit != 'true'
        id: composer-cache
        shell: bash
        # language=bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-tooling-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-tooling-
            composer-${{ runner.os }}-
      - name: Install dependencies
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          composer update \
            --no-interaction \
            --prefer-dist \
            --no-progress
      - name: Run tooling tests
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        # language=bash
        run: |
          vendor/bin/pest \
            --testsuite=Tools \
            --no-coverage
      - name: Record result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        shell: bash
        # language=bash
        run: echo "${GITHUB_SHA}" > .ci-marker
      - name: Persist result marker
        if: ${{ success() && steps.marker.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .ci-marker
          key: ${{ steps.marker.outputs.cache-primary-key }}
