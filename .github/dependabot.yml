version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    open-pull-requests-limit: 5
    versioning-strategy: widen
    labels:
      - "dependencies"
      - "php"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "weekly"
